# Builds the app on every version tag (v1.3, v1.4 ...) and attaches the APK to that tag's
# GitHub release, so people can download it straight to their TV (docs/SETUP.md).
#
# Signing: with the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD set, the release build is signed with your own key (docs/BUILDING.md), so
# later versions install over earlier ones. Without them, a debug-signed APK is attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner already has the Android SDK (ANDROID_HOME); the wrapper brings Gradle.
      - name: Signing key (if set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK=doomsday/build/outputs/apk/release/doomsday-release.apk" >> "$GITHUB_ENV"
          else
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK=doomsday/build/outputs/apk/debug/doomsday-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest "$TASK" --no-daemon
      - name: Name the APK
        run: cp "$APK" "doomsday-tv-${GITHUB_REF_NAME}.apk"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: doomsday-tv-${{ github.ref_name }}.apk
          generate_release_notes: true
